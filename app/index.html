<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlantID — Reconnaissance de plantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div class="hero" id="hero">
    <div class="hero-glow"></div>

    <svg class="vine-svg" viewBox="0 0 640 170" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <symbol id="leaf-shape" viewBox="-14 -44 28 48">
          <path d="M0,0 C-11,-9 -12,-30 0,-42 C12,-30 11,-9 0,0 Z" fill="currentColor"/>
          <path d="M0,-4 L0,-37" stroke="rgba(0,0,0,0.18)" stroke-width="1.4" fill="none"/>
        </symbol>
      </defs>

      <path class="vine-path"
        d="M-10,130 C60,75 120,165 190,105 C260,45 320,145 390,85 C460,25 520,115 590,65 C612,50 626,55 650,45" />

      <use href="#leaf-shape" class="vine-leaf vl-1" x="65"  y="88"  width="26" height="44" transform="rotate(-18 65 88)"/>
      <use href="#leaf-shape" class="vine-leaf vl-2" x="185" y="98"  width="30" height="50" transform="rotate(22 185 98)"/>
      <use href="#leaf-shape" class="vine-leaf vl-3" x="300" y="118" width="24" height="40" transform="rotate(-10 300 118)"/>
      <use href="#leaf-shape" class="vine-leaf vl-4" x="410" y="72"  width="28" height="46" transform="rotate(16 410 72)"/>
      <use href="#leaf-shape" class="vine-leaf vl-5" x="540" y="90"  width="24" height="40" transform="rotate(-24 540 90)"/>
    </svg>

    <svg class="ambient-svg" viewBox="0 0 640 170" preserveAspectRatio="none" aria-hidden="true">
      <use href="#leaf-shape" class="ambient-leaf af-1" x="40"  y="35" width="20" height="34"/>
      <use href="#leaf-shape" class="ambient-leaf af-2" x="230" y="20" width="16" height="28"/>
      <use href="#leaf-shape" class="ambient-leaf af-3" x="470" y="140" width="18" height="30"/>
      <use href="#leaf-shape" class="ambient-leaf af-4" x="600" y="130" width="22" height="36"/>
    </svg>

    <div class="hero-text">
      <div class="eyebrow">Reconnaissance botanique</div>
      <h1>PlantID</h1>
      <p class="subtitle">Dépose une photo de plante pour identifier son espèce parmi 30 catégories reconnues par le modèle.</p>
    </div>
  </div>

  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="image/*">
    <span class="dropzone-icon">🌿</span>
    <div class="dropzone-text">Clique ou dépose une image ici</div>
    <div class="dropzone-hint">JPG, PNG — une feuille, une fleur, une plante entière</div>
    <img id="preview" alt="Aperçu de l'image">
  </div>

  <button class="btn" id="submitBtn" disabled>Identifier la plante</button>

  <div class="status" id="status"></div>

  <div class="result" id="result">
    <div class="result-label">Espèce identifiée</div>
    <div class="result-name" id="resultName">—</div>
    <div class="result-latin" id="resultLatin"></div>

    <div class="confidence-row">
      <div class="confidence-value">
        <span>Confiance du modèle</span>
        <span id="confidencePct">—</span>
      </div>
      <div class="confidence-track">
        <div class="confidence-fill" id="confidenceFill" style="width:0%"></div>
      </div>
    </div>

    <div id="warningBlock"></div>
    <div id="descriptionBlock"></div>

    <div class="info-grid" id="infoGrid"></div>
  </div>

  <div class="config">
    URL de l'API : <input type="text" id="apiUrl" value="http://localhost:5000/predict">
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
