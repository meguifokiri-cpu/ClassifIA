services:
  api:
    build: .
    container_name: classifia-api
    restart: unless-stopped
    expose:
      - "5000"

  frontend:
    image: nginx:alpine
    container_name: classifia-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api